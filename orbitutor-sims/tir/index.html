<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Total Internal Reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#e9f3fc;--card:#fff;--title:#3f7fd0;--ink:#3a63a8;--coral:#e8897f;--amber:#f2b705;--deep:#27348b;--grey:#9aa7b4;--frame:#3f7fd0;--glass:#d7ecff;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);font-family:'PT Serif',Georgia,serif;color:var(--ink)}
  .wrap{height:100%;display:flex;flex-direction:column;padding:16px;gap:14px}
  header{text-align:center}
  header h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;color:var(--title);text-shadow:2px 2px 0 #cfe3f7}
  header p{font-size:15px;color:var(--ink);margin-top:2px}
  .stage{flex:1;background:var(--card);border:4px solid var(--frame);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(63,127,208,.15)}
  canvas{display:block;width:100%;height:100%}
  .panel{background:var(--card);border-radius:22px;box-shadow:0 4px 16px rgba(63,127,208,.12);padding:14px 22px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .ctrl{display:flex;flex-direction:column;gap:6px;min-width:230px;flex:1}
  .ctrl label{font-family:'Fredoka',sans-serif;font-size:15px;display:flex;justify-content:space-between;color:var(--ink)}
  .ctrl label b{color:var(--title)}
  input[type=range]{accent-color:var(--frame);height:24px}
  .read{display:flex;gap:20px;font-family:'Fredoka',sans-serif;font-size:15px}
  .read .chip{background:#eef5fd;border-radius:12px;padding:8px 14px;color:var(--ink)}
  .read .chip b{color:var(--title)}
  #status{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;padding:8px 16px;border-radius:12px}
  .ok{background:#eafaf1;color:#1f9d57}.tir{background:#fdecec;color:#d5553f}
</style></head>
<body>
<div class="wrap">
  <header><h1>Total Internal Reflection</h1><p>Light travelling from glass into air — increase the angle and watch it refract, graze the surface, then reflect completely.</p></header>
  <div class="stage"><canvas id="c"></canvas></div>
  <div class="panel">
    <div class="ctrl"><label>Angle of incidence <b id="aiV">30°</b></label><input id="ai" type="range" min="0" max="89" value="30"></div>
    <div class="ctrl"><label>Glass index n₁ <b id="n1V">1.50</b></label><input id="n1" type="range" min="120" max="240" value="150"></div>
    <div class="read">
      <div class="chip">n₂ (air) <b>1.00</b></div>
      <div class="chip">Critical angle <b id="tcV">41.8°</b></div>
    </div>
    <div id="status" class="ok">Refracting</div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TITLE='#3f7fd0',INK='#3a63a8',CORAL='#e8897f',AMBER='#f2b705',DEEP='#27348b',GREY='#9aa7b4',GLASS='#d7ecff';
let W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resize);
const ai=document.getElementById('ai'),n1s=document.getElementById('n1');
const aiV=document.getElementById('aiV'),n1V=document.getElementById('n1V'),tcV=document.getElementById('tcV'),status=document.getElementById('status');
let dash=0;
function arrow(x1,y1,x2,y2,color,w,alpha){ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1),hl=18,hw=.45;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-hw),y2-hl*Math.sin(a-hw));ctx.lineTo(x2-hl*Math.cos(a+hw),y2-hl*Math.sin(a+hw));ctx.closePath();ctx.fill();ctx.restore();}
function flow(x1,y1,x2,y2,color,w,alpha){ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.setLineDash([3,16]);ctx.lineDashOffset=-dash;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function txt(s,x,y,c,px,al,font){ctx.save();ctx.fillStyle=c;ctx.font=(font||'600 ')+px+"px Fredoka, sans-serif";ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore();}
function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=W*0.5, y0=H*0.52, L=Math.min(W,H)*0.42;
  // media
  ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,W,y0);
  ctx.fillStyle=GLASS;ctx.fillRect(0,y0,W,H-y0);
  ctx.strokeStyle='#bcd6f2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.stroke();
  txt('AIR   n₂ = 1.00',24,28,GREY,18,'left');
  txt('GLASS   n₁ = '+(+n1s.value/100).toFixed(2),24,H-26,'#5f84bd',18,'left');
  // normal
  ctx.save();ctx.strokeStyle=GREY;ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(cx,y0-L*1.05);ctx.lineTo(cx,y0+L*1.05);ctx.stroke();ctx.restore();
  txt('normal',cx+10,y0-L*1.02,GREY,14,'left','400 ');
  const n1=+n1s.value/100,n2=1.0;
  const th1=(+ai.value)*Math.PI/180;
  const tc=Math.asin(n2/n1);
  // incident ray (from lower-left up to O), math coords y-up -> canvas
  const Px=cx+ -L*Math.sin(th1), Py=y0+ L*Math.cos(th1); // start lower-left
  arrow(Px,Py,cx,y0,CORAL,6);
  flow(Px,Py,cx,y0,'#fff',2,.8);
  // reflected ray (into glass, down-right)
  const Rx=cx+L*Math.sin(th1), Ry=y0+L*Math.cos(th1);
  const sint2=n1/n2*Math.sin(th1);
  const isTIR=sint2>=1;
  const reflA=isTIR?1:0.33+0.5*Math.min(1,Math.max(0,(th1/tc)));
  arrow(cx,y0,Rx,Ry,AMBER,isTIR?6:4,reflA);
  if(isTIR)flow(cx,y0,Rx,Ry,'#fff',2,.8);
  // refracted ray (into air) if not TIR
  if(!isTIR){
    const th2=Math.asin(sint2);
    const Tx=cx+L*Math.sin(th2), Ty=y0-L*Math.cos(th2);
    const refA=1-0.7*Math.min(1,Math.max(0,(th1/tc)));
    arrow(cx,y0,Tx,Ty,DEEP,6,Math.max(.25,refA));
    flow(cx,y0,Tx,Ty,'#cfe0ff',2,Math.max(.25,refA));
    // theta2 arc
    ctx.save();ctx.strokeStyle=DEEP;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,y0,54,-Math.PI/2,-Math.PI/2+th2);ctx.stroke();ctx.restore();
    txt('θ₂='+(th2*180/Math.PI).toFixed(0)+'°',cx+70,y0-60,DEEP,16,'left');
  }
  // theta1 arc
  ctx.save();ctx.strokeStyle=CORAL;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,y0,54,Math.PI/2,Math.PI/2+th1);ctx.stroke();ctx.restore();
  txt('θ₁='+(+ai.value)+'°',cx-120,y0+60,CORAL,16,'left');
  // incidence point
  ctx.beginPath();ctx.arc(cx,y0,6,0,7);ctx.fillStyle=TITLE;ctx.fill();
  // update UI
  aiV.textContent=(+ai.value)+'°';n1V.textContent=n1.toFixed(2);
  tcV.textContent=(tc*180/Math.PI).toFixed(1)+'°';
  if(isTIR){status.textContent='Total Internal Reflection';status.className='tir';}
  else{status.textContent='Refracting';status.className='ok';}
}
ai.oninput=n1s.oninput=draw;
function loop(){dash=(dash+1.2)%19;draw();requestAnimationFrame(loop);}
resize();loop();
</script>
</body></html>
